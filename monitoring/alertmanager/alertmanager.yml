route:
  group_by:
  - alertname
  - batch_id
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: ml-team
  routes:
  - matchers:
    - team="oncall"
    receiver: oncall
  - matchers:
    - team="platform"
    receiver: platform
  - matchers:
    - team="ml-team"
    receiver: ml-team
receivers:
- name: oncall
  webhook_configs:
  - url: http://alert-receiver:8000/alerts
- name: platform
  webhook_configs:
  - url: http://alert-receiver:8000/alerts
- name: ml-team
  webhook_configs:
  - url: http://alert-receiver:8000/alerts
inhibit_rules:
- source_matchers:
  - alertname="ContractViolation"
  target_matchers:
  - alertname=~"FeatureDrift.*|ModelPerformanceDrop|RetrainRecommended|LabelDrift|ConceptDriftSuspected"
  equal:
  - batch_id
- source_matchers:
  - alertname="FeatureDriftCritical"
  target_matchers:
  - alertname="FeatureDriftWarning"
  equal:
  - batch_id
  - feature
- source_matchers:
  - alertname="PipelineStageFailed"
  target_matchers:
  - alertname="PipelineStale"
