global:
  scrape_interval: 15s
rule_files:
- alert_rules.yml
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: pushgateway
  static_configs:
  - targets:
    - pushgateway:9091
  honor_labels: true
- job_name: loki
  static_configs:
  - targets:
    - loki:3100
- job_name: tempo
  static_configs:
  - targets:
    - tempo:3200
- job_name: alloy
  static_configs:
  - targets:
    - alloy:12345
- job_name: alertmanager
  static_configs:
  - targets:
    - alertmanager:9093
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
