# Hooks executados antes de cada commit (instalar com: make setup).
# Mesmo critério do `make lint` e do CI, só que automático.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5000] # bloqueia dados e modelos commitados por engano
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^(reports|models|notebooks)/
      - id: trailing-whitespace
        exclude: ^(reports|models|notebooks)/
