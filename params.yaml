# Parâmetros ajustáveis do pipeline, validados por
# src/credit_scoring_observability/parameters.py (chave desconhecida = erro).
# Cada etapa é dona da sua seção.

# ── Etapa 1 ──────────────────────────────────────────────────────────────────
split:
  # Mesmo split dos notebooks 02–04: 80/20 estratificado, random_state 42.
  # O teste (269.620 linhas) vira o pool de produção.
  test_size: 0.2
  reference_sample_rows: 100000
  chunksize: 100000

train:
  # Configuração do notebook 04 (V2).
  train_sample_rows: 300000
  validation_fraction: 0.2
  # Seleção do threshold na validação: maior F2 com Precision mínima.
  min_precision: 0.30
  threshold_grid: {start: 0.10, stop: 0.90, step: 0.025}
  class_weights: [standard, balanced]
  max_iter: 500
  tol: 0.001

contract:
  # Volume mínimo de um lote para ser pontuado.
  min_rows: 500

# ── Etapa 2 (drift) ──────────────────────────────────────────────────────────
# Intervenções verificadas na reserva de calibração; limiares de drift abaixo.
simulation:
  seed: 42
  batch_rows: 10000
  control_rows: 30000
  calibration_rows: 10000
  demo_rows: 2000
  months: ["2026-01", "2026-02", "2026-03", "2026-04", "2026-05", "2026-06", "2026-07"]
  data_intensities: [0.6, 1.0]
  concept_intensities: [0.35, 0.55, 0.75]
  # Intervenções máximas, multiplicadas pela intensidade de cada mês.
  income_reduction: 0.35
  dti_increase: 0.8
  utilization_increase_pp: 25.0
  fico_drop_points: 30
  # Relabel por segmentos, sem consultar scores do modelo.
  concept_low_fico: 680
  concept_high_fico: 700
  concept_default_probability: 0.25
  concept_cure_probability: 0.2

drift:
  bins: 10
  epsilon: 0.000001
  psi_warning: 0.10
  psi_alert: 0.25
  ks_d: 0.10
  categorical_js: 0.10
  missing_rate_delta: 0.05
  label_z: 3.0

performance:
  auc_drop: 0.05
  bootstrap_samples: 200
  seed: 42

gate:
  min_labeled_rows: 500
  min_label_coverage: 0.9
  min_bootstrap_samples: 100

# ── Etapa 4 (governança) ─────────────────────────────────────────────────────
retention:
  # LGPD: lote bloqueado fica na quarentena só o tempo de a origem corrigir.
  quarantine_days: 30
