[project]
name = "credit-scoring-observability"
version = "0.1.0"
description = "Credit scoring, data quality, drift detection and model observability for the FIAP Tech Challenge Phase 4."
readme = "README.md"
authors = [
    { name = "fabii_necca", email = "neccaluizon@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pandera[pandas]>=0.33.1",
    "scikit-learn>=1.9.1",
    # Etapa 1: parquet, parâmetros validados, .env e logs estruturados.
    "pyarrow>=16",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    # Núcleo das Etapas 2–4, só declarado aqui para evitar conflito de uv.lock
    # entre PRs paralelos. Extras (NannyML, Great Expectations, OpenTelemetry)
    # entram pelo PR de quem for usar.
    "evidently>=0.7",
    "mlflow>=3.0",
    "prometheus-client>=0.20",
    "psutil>=7.0",
    "fairlearn>=0.11",
]

# Pontos de entrada: `python -m credit_scoring_observability.<módulo>` (ver Makefile).
[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "pre-commit>=3.7",
]

[tool.ruff]
target-version = "py311"
line-length = 88
# Notebooks de estudo têm estilo exploratório e os blocos de código dos .md são
# ilustrativos; o lint protege o código em src/ e tests/
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]
# Texto em português usa travessão e sinal de multiplicação (ex.: 2013–2014, pago × inadimplente).
allowed-confusables = ["–", "×"]

[tool.ruff.lint.isort]
known-first-party = ["credit_scoring_observability"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
markers = ["integration: roda as CLIs de ponta a ponta (mais lento)"]

[tool.coverage.run]
source = ["credit_scoring_observability"]

[tool.coverage.report]
show_missing = true
